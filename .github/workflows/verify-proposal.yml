name: Verify proposal

# The check the founder relies on before tapping Merge (doc #320 r3; Security
# b1, b2). It lives on naetive/releases, where only a founder merge can change
# it, and runs from releases main (pull_request_target), never from the pull
# request. It rebuilds the platform commit the proposal names and passes only
# when every package's version and sha256 match. Make "Rebuilt from source"
# a required check on main.
#
# Needs, in the environment "platform-read": the secret PLATFORM_DEPLOY_KEY, a
# read-only deploy key on naetive/platform.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  read:
    name: Read the proposal
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.read.outputs.commit }}
      pieces: ${{ steps.read.outputs.pieces }}
    steps:
      # releases main, not the pull request (the default for pull_request_target).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.11.0'
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/verify/read-proposal.mjs

  fetch:
    name: Fetch the platform commit
    needs: read
    runs-on: ubuntu-24.04
    environment: platform-read
    steps:
      - name: Exactly that commit, on platform main; the key is gone before anything is built
        env:
          COMMIT: ${{ needs.read.outputs.commit }}
          DEPLOY_KEY: ${{ secrets.PLATFORM_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad commit"; exit 1; }
          key="$RUNNER_TEMP/platform-key"; umask 077; printf '%s\n' "$DEPLOY_KEY" > "$key"; unset DEPLOY_KEY
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | grep -q 'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU' || { echo "::error::github.com host key is not GitHub's"; exit 1; }
          git init -q src && cd src
          git remote add origin git@github.com:naetive/platform.git
          # main's full commit history, no file contents; a commit on main is then here.
          git fetch -q --filter=blob:none origin main
          git cat-file -e "$COMMIT^{commit}" 2>/dev/null && git merge-base --is-ancestor "$COMMIT" origin/main || { echo "::error::$COMMIT is not on platform main"; exit 1; }
          # Never the committed packages: a match must come from building (Security v2).
          git archive --format=tar -o "$RUNNER_TEMP/source.tar" "$COMMIT" -- scripts packages/mcp-core ':!scripts/console-dist'
          cd .. && rm -rf src "$key"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: platform-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 1

  rebuild:
    name: Rebuilt from source
    needs: [read, fetch]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # A skipped or failed step before this one is a failure here, never a pass.
      - name: Every step before passed
        env:
          READ: ${{ needs.read.result }}
          FETCH: ${{ needs.fetch.result }}
        run: '[[ "$READ" == success && "$FETCH" == success ]] || { echo "::error::read: $READ, fetch: $FETCH"; exit 1; }'
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: platform-source
          path: ${{ runner.temp }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.11.0'
      # The verdict is this file's own shell, owned by naetive/releases (Security v1):
      # the platform's build script only produces the package; the sha256 and the
      # version are read and compared here, never by platform code.
      - name: Each package is exactly what the commit builds (no secrets in this job)
        env:
          PIECES: ${{ needs.read.outputs.pieces }}
        run: |
          set -euo pipefail
          mkdir platform && tar -xf "$RUNNER_TEMP/source.tar" -C platform
          [[ ! -e platform/scripts/console-dist ]] || { echo "::error::the source holds packages"; exit 1; }
          [[ -n "$PIECES" ]] || { echo "::error::no pieces"; exit 1; }
          failed=0
          while IFS='=' read -r kind version sha; do
            [[ "$kind" =~ ^(tunnel|cli|console)$ && "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{8}$ && "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad piece line"; exit 1; }
            case "$kind" in
              tunnel) script=build-tunnel-tarball.sh; tarball=naetive-tunnel.tar.gz; meta=naetive-tunnel.version.json; dateenv=TUNNEL_BUILD_DATE ;;
              cli)    script=build-cli-tarball.sh;    tarball=naetive-cli.tar.gz;    meta=naetive-cli.version.json;    dateenv=CLI_BUILD_DATE ;;
              console) echo "::error::console: its source is not in a repository this check can read yet (doc 320 b3)"; failed=1; continue ;;
            esac
            out="$RUNNER_TEMP/out-$kind"; rm -rf "$out"; mkdir "$out"
            ( cd platform && env -i PATH="/usr/local/bin:/usr/bin:/bin:$(dirname "$(command -v node)")" HOME="$RUNNER_TEMP" LC_ALL=C TZ=UTC \
                OUT_DIR_OVERRIDE="$out" "$dateenv=${version:0:10}" bash "scripts/$script" >/dev/null ) || { echo "::error::$kind: the build failed"; failed=1; continue; }
            got_sha="$(sha256sum "$out/$tarball" | cut -d' ' -f1)"
            got_version="$(jq -r '.version' "$out/$meta")"
            if [[ "$got_version" == "$version" && "$got_sha" == "$sha" ]]; then
              echo "✓ $kind $version: rebuilt from source, sha256 matches"
            else
              echo "::error::$kind: this commit builds $got_version with sha256 $got_sha, not $version with $sha"; failed=1
            fi
          done <<< "$PIECES"
          exit "$failed"
